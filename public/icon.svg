<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="url(#brand)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Robot / Processor Head Outline -->
  <rect x="7" y="9" width="18" height="15" rx="3.5" fill="#161b2b" stroke="url(#brand)" stroke-width="1.5"/>

  <!-- Antenna -->
  <path d="M16 6 L16 9" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="5" r="1.5" fill="#00f0ff"/>

  <!-- Digital Eyes / Counter Symbol -->
  <rect x="10" y="13.5" width="4" height="4" rx="1" fill="#00f0ff"/>
  <rect x="18" y="13.5" width="4" height="4" rx="1" fill="#00f0ff"/>

  <!-- Binary / Counter Plus Notch -->
  <path d="M14 20 L18 20" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
</svg>
